name: theyabliki-db-audit
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: theyabliki_test
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD:?Set DB_TEST_PASSWORD}
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-55433}:5432"
    volumes:
      - audit_data:/var/lib/postgresql/data
      - ./schema.sql:/audit/schema.sql:ro
      - ./migrations:/audit/migrations:ro
      - ./tests:/audit/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d theyabliki_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  audit_data:
