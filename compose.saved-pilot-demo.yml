# PUBLIC credentials below are intentional, synthetic-demo-only, NOT secrets.
# Localhost only. Never deploy this environment to the Internet or production.
# New project/volume namespace preserves pre-v1.28.2 password-protected volumes.
name: pulse-saved-pilot-public
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: test_saved_pilot_demo
      POSTGRES_USER: pulse_pilot
      POSTGRES_PASSWORD: "0123456789abcdef0123456789abcdef"
    volumes:
      - saved_pilot_public_v1282_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/migrations/002_pulse_features.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./database/migrations/003_integrity.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ./database/migrations/004_news_external_identity.sql:/docker-entrypoint-initdb.d/004.sql:ro
      - ./database/migrations/005_saved_news_analysis_jobs.sql:/docker-entrypoint-initdb.d/005.sql:ro
      - ./database/migrations/006_news_company_matching.sql:/docker-entrypoint-initdb.d/006.sql:ro
      - ./database/migrations/007_auth_access.sql:/docker-entrypoint-initdb.d/007.sql:ro
      - ./database/saved-pilot-demo-marker.sql:/docker-entrypoint-initdb.d/900_marker.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U pulse_pilot -d test_saved_pilot_demo"]
      interval: 2s
      timeout: 3s
      retries: 45
  backend:
    image: pulse-saved-pilot-demo:local
    build:
      context: ./backend
      dockerfile: Dockerfile.saved-pilot
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse_pilot:0123456789abcdef0123456789abcdef@postgres:5432/test_saved_pilot_demo
      AI_MODE: demo
      SAVED_PILOT_OFFLINE: "1"
      DATASET_AI_TRANSPORT: fake
      DATASET_AI_MANIFEST: ""
      DATASET_AI_MANIFEST_SHA256: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      CORS_ORIGINS: http://localhost:8082,http://127.0.0.1:8082
      RAG_KNOWLEDGE_BASE_DIR: /tmp/empty-synthetic-rag
    ports:
      - "127.0.0.1:${SAVED_PILOT_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)"]
      interval: 3s
      timeout: 10s
      retries: 15
      start_period: 10s
  seed:
    image: pulse-saved-pilot-demo:local
    # Seed shares only this project's PostgreSQL network namespace. The strict
    # loopback target guard remains enabled; no host PostgreSQL is reachable here.
    network_mode: service:postgres
    environment:
      SAVED_PILOT_DEMO_PASSWORD: "PulseDemo2026Viewer"
      SAVED_PILOT_DATABASE_URL: postgresql+asyncpg://pulse_pilot:0123456789abcdef0123456789abcdef@127.0.0.1:5432/test_saved_pilot_demo
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL: ""
    command: [python, -B, -m, saved_pilot_demo, --expected-database, test_saved_pilot_demo, --apply, --confirm-isolated, --password-env, --verify-backend-connection]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: pulse-saved-pilot-frontend:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${SAVED_PILOT_FRONTEND_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  saved_pilot_public_v1282_data:
